{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h3>Categorías</h3>
    <a href="{% url 'crear_categoria' %}" class="btn btn-success">+ Nueva Categoría</a>
</div>
<table class="table table-striped datatable">
    <thead><tr><th>Nombre</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr></thead>
    <tbody>
        {% for c in categorias %}
        <tr>
            <td>{{ c.nombre }}</td>
            <td>{{ c.descripcion }}</td>
            <td>{% if c.estado %}<span class="badge bg-success">Activo</span>{% else %}<span class="badge bg-danger">Inactivo</span>{% endif %}</td>
            <td>
                <a href="{% url 'editar_categoria' c.id %}" class="btn btn-warning btn-sm">Editar</a>
                <a href="{% url 'eliminar_categoria' c.id %}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
